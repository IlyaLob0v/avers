# Ora2Pg 25: перенос схемы JACK со стенда Oracle Free 23 в PostgreSQL (схема legacy).
# Порядок — docs/04-db-migration-plan.md, запуск — db/stand/stand.sh.
# Паролей здесь нет: stand.sh передаёт их из .env ключами -w / --pg_pwd.
# Схема источника и приёмника тоже задаются из stand.sh (-n / -N), здесь — значения по умолчанию.

#------ Источник: Oracle Free 23 на стенде (контейнер oracle-legacy) ------
ORACLE_DSN      dbi:Oracle:host=oracle-legacy;service_name=FREEPDB1;port=1521
ORACLE_USER     system
SCHEMA          JACK
# База стенда в AL32UTF8: impdp сам перекодирует выгрузку из cp1251 (CL8MSWIN1251).
# Запасной путь (Ora2Pg прямо с боевого 10.2) — заменить на AMERICAN_AMERICA.CL8MSWIN1251.
NLS_LANG        AMERICAN_AMERICA.AL32UTF8
USER_GRANTS     0
DEBUG           0

#------ Приёмник: PostgreSQL 18, схема legacy — зеркало JACK как есть ------
# Подключение к PostgreSQL (PG_DSN, пользователь, пароль) stand.sh передаёт только на шаге данных (COPY),
# чтобы структура выгружалась в файлы и загружалась отдельно, в нужном порядке.
PG_VERSION      17
EXPORT_SCHEMA   1
PG_SCHEMA       legacy
CREATE_SCHEMA   0
CLIENT_ENCODING UTF8
# Имена в нижнем регистре без кавычек: jack.PHYSPERS -> legacy.physpers
PRESERVE_CASE   0

#------ Типы данных ------
# Деньги остаются точными: NUMBER(p,s) -> numeric(p,s), без float
PG_NUMERIC_TYPE 0
# NUMBER(p) без дробной части -> smallint/integer/bigint
PG_INTEGER_TYPE 1
# NUMBER без точности может хранить копейки — только numeric, не bigint (значение Ora2Pg по умолчанию)
DEFAULT_NUMERIC numeric
# Пустые строки Oracle и так NULL; ничего не подменяем
EMPTY_LOB_NULL  1

#------ Выгрузка структуры ------
# Таблицы отдельно от ключей и индексов: сначала данные, потом ограничения (быстрее и без ошибок порядка)
FILE_PER_CONSTRAINT 1
FILE_PER_INDEX      1
FILE_PER_FKEYS      1
# Триггеры и код Oracle в legacy не переносим — они выгружаются только для разбора
DISABLE_TRIGGERS    1

#------ Выгрузка данных ------
# Перед загрузкой таблица очищается: прогон можно повторять сколько угодно раз
TRUNCATE_TABLE  1
DATA_LIMIT      10000
STOP_ON_ERROR   1
