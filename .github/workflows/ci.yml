name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        if: hashFiles('Avers.sln') != ''
        run: dotnet restore Avers.sln
      - name: Build
        if: hashFiles('Avers.sln') != ''
        run: dotnet build Avers.sln -c Release --no-restore
      - name: Test
        if: hashFiles('Avers.sln') != ''
        run: dotnet test Avers.sln -c Release --no-build
      - name: Format check
        if: hashFiles('Avers.sln') != ''
        run: dotnet format Avers.sln --verify-no-changes

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: avers
          POSTGRES_PASSWORD: avers_ci
          POSTGRES_DB: avers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avers -d avers"
          --health-interval 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: avers
      PGPASSWORD: avers_ci
      PGDATABASE: avers
    steps:
      - uses: actions/checkout@v6
      - name: Shellcheck
        run: shellcheck db/stand/stand.sh db/migration/reconcile/test/run-tests.sh
      - name: Docker Compose config
        run: docker compose -f db/docker-compose.yml --profile legacy config -q
      - name: Reconcile tests
        run: bash db/migration/reconcile/test/run-tests.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "docs/**/*.md"
        continue-on-error: true
