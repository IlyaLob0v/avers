name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        if: hashFiles('Avers.sln') != ''
        run: dotnet restore Avers.sln
      - name: Build
        if: hashFiles('Avers.sln') != ''
        run: dotnet build Avers.sln -c Release --no-restore
      - name: Test
        if: hashFiles('Avers.sln') != ''
        run: dotnet test Avers.sln -c Release --no-build
      - name: Format check
        if: hashFiles('Avers.sln') != ''
        run: dotnet format Avers.sln --verify-no-changes
      - name: Publish Windows build
        run: dotnet publish src/Avers.Desktop/Avers.Desktop.csproj -p:PublishProfile=win-x64
      - name: Smoke start
        shell: pwsh
        run: |
          $app = Start-Process src/Avers.Desktop/bin/publish/Avers/Avers.exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Аверс закрылся при запуске, код $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: Avers-win-x64
          path: src/Avers.Desktop/bin/publish/
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish Linux build
        run: dotnet publish src/Avers.Desktop/Avers.Desktop.csproj -p:PublishProfile=linux-x64
      - name: Smoke start
        run: |
          sudo apt-get install -y -qq xvfb
          xvfb-run -a timeout 20 src/Avers.Desktop/bin/publish-linux/Avers/Avers || [ $? -eq 124 ]
      - name: Package
        run: |
          mkdir -p out
          cp -r src/Avers.Desktop/bin/publish-linux/Avers out/Avers
          cp deploy/xrdp/* out/
      - uses: actions/upload-artifact@v4
        with:
          name: Avers-linux-x64
          path: out/
          retention-days: 30
      - name: Publish server
        run: |
          dotnet publish src/Avers.Server/Avers.Server.csproj -c Release -r linux-x64 --self-contained -o out-server/avers-server
          cp deploy/server/* out-server/
      - uses: actions/upload-artifact@v4
        with:
          name: Avers-server-linux-x64
          path: out-server/
          retention-days: 30

  server-postgres:
    # Серверные тесты на настоящем PostgreSQL: в build они идут на SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: avers
          POSTGRES_PASSWORD: avers_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avers"
          --health-interval 5s
          --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVERS_TEST_POSTGRES: Host=localhost;Username=avers;Password=avers_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Server tests on PostgreSQL
        run: dotnet test tests/Avers.Server.Tests -c Release

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: avers
          POSTGRES_PASSWORD: avers_ci
          POSTGRES_DB: avers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avers -d avers"
          --health-interval 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: avers
      PGPASSWORD: avers_ci
      PGDATABASE: avers
    steps:
      - uses: actions/checkout@v6
      - name: Shellcheck
        run: shellcheck db/stand/stand.sh db/migration/reconcile/test/run-tests.sh deploy/xrdp/install.sh deploy/xrdp/startwm.sh deploy/server/install.sh deploy/server/avers-password deploy/server/avers-backup deploy/server/avers-internet
      - name: Docker Compose config
        run: docker compose -f db/docker-compose.yml --profile legacy config -q
      - name: Reconcile tests
        run: bash db/migration/reconcile/test/run-tests.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "docs/**/*.md"
        continue-on-error: true
