<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аверс · дома</title>
<style>
  :root { --navy: #0a2f5c; --blue: #2b5cb0; --face: #eef0f3; --line: #cdd3dc; --warn: #fff4c2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 "Segoe UI", Tahoma, sans-serif; background: var(--face); color: #000; }
  header { background: var(--navy); color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 17px; }
  header button { background: none; border: 1px solid #fff; color: #fff; padding: 4px 10px; border-radius: 3px; font: inherit; font-size: 14px; }
  main { padding: 12px 16px 32px; max-width: 640px; margin: 0 auto; }
  label { display: block; font-size: 14px; margin: 10px 0 4px; }
  input { width: 100%; padding: 10px; font: inherit; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
  .row { display: flex; gap: 8px; }
  .row > div:first-child { flex: 3; }
  .row > div:last-child { flex: 1; }
  .primary { width: 100%; margin-top: 14px; padding: 12px; font: inherit; color: #fff; background: var(--blue); border: 0; border-radius: 3px; }
  .error { color: #b00020; margin-top: 10px; }
  .muted { color: #555; font-size: 14px; }
  ul.houses { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.houses button { width: 100%; text-align: left; padding: 12px; margin-bottom: 6px; font: inherit; background: #fff; border: 1px solid var(--line); border-radius: 3px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin-top: 10px; }
  section h2 { font-size: 15px; margin: 0 0 6px; color: var(--navy); }
  section.fault { background: var(--warn); }
  dl { margin: 0; }
  dt { font-size: 13px; color: #555; margin-top: 6px; }
  dd { margin: 0; white-space: pre-wrap; }
  a { color: var(--blue); }
  .back { background: none; border: 0; color: var(--blue); font: inherit; padding: 8px 0; }
  .scheme { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 10px; font: inherit; background: #fff; border: 1px solid var(--blue); border-radius: 3px; color: var(--blue); }
  #viewer { position: fixed; inset: 0; background: #000; overflow: auto; z-index: 10; }
  #viewer canvas { display: block; width: 100%; }
  #viewer.full canvas { width: auto; }
  #viewer button { position: fixed; top: 8px; right: 8px; padding: 8px 14px; font: inherit; background: #fff; border: 0; border-radius: 3px; }
  header nav { display: flex; gap: 8px; }
  #map { position: fixed; left: 0; right: 0; bottom: 0; top: var(--top, 48px); }
  #map-canvas { position: absolute; inset: 0; }
  .map-bar { position: absolute; top: 8px; left: 8px; right: 52px; max-width: 420px; z-index: 2; }
  .map-bar input { box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .map-bar ul { list-style: none; margin: 4px 0 0; padding: 4px; background: #fff; border: 1px solid var(--line); border-radius: 3px; max-height: 50vh; overflow: auto; }
  .map-bar li button { width: 100%; text-align: left; padding: 8px; font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 1px solid var(--face); }
  .map-bar li.muted { padding: 6px 8px; }
  #map-missing { margin-top: 6px; padding: 6px 10px; font: inherit; font-size: 14px; background: #fff; border: 1px solid var(--blue); color: var(--blue); border-radius: 3px; }
  #map-note:not(:empty) { margin-top: 6px; padding: 8px 10px; font-size: 14px; background: var(--warn); border: 1px solid #e0c96a; border-radius: 3px; }
  .maplibregl-popup-content { font: 15px/1.35 "Segoe UI", Tahoma, sans-serif; }
  .maplibregl-popup-content div button { display: block; width: 100%; margin-top: 6px; padding: 6px 8px; font: inherit; font-size: 14px; color: var(--blue); background: #fff; border: 1px solid var(--blue); border-radius: 3px; }
  .fault-note { color: #b00020; font-size: 14px; margin-top: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><b>Аверс · дома</b><nav><button id="map-open" hidden>Карта</button><button id="list-open" hidden>Поиск</button><button id="logout" hidden>Выйти</button></nav></header>
<main>
  <form id="login" hidden>
    <label for="user">Логин</label>
    <input id="user" autocomplete="username" autocapitalize="none" required>
    <label for="pass">Пароль</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="primary">Войти</button>
    <div class="error" id="login-error"></div>
  </form>

  <div id="search" hidden>
    <div class="row">
      <div><label for="street">Улица</label><input id="street" placeholder="Начало названия"></div>
      <div><label for="number">Дом</label><input id="number" inputmode="numeric"></div>
    </div>
    <ul class="houses" id="houses"></ul>
    <div class="muted" id="search-note"></div>
  </div>

  <div id="house" hidden>
    <button class="back" id="back">← Назад</button>
    <div id="house-body"></div>
  </div>
</main>
<div id="map" hidden>
  <div id="map-canvas"></div>
  <div class="map-bar">
    <input id="map-search" placeholder="Улица и дом, например «волоч 19»" autocomplete="off">
    <ul id="map-results" hidden></ul>
    <button id="map-missing" hidden></button>
    <div id="map-note"></div>
  </div>
</div>
<div id="viewer" hidden><canvas id="viewer-canvas"></canvas><button id="viewer-close">Закрыть</button></div>
<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem("avers-token");

function show(id) {
  for (const s of ["login", "search", "house", "map"]) $(s).hidden = s !== id;
  $("logout").hidden = id === "login";
  $("map-open").hidden = id === "login" || id === "map";
  $("list-open").hidden = id !== "map";
  document.documentElement.style.setProperty("--top", document.querySelector("header").offsetHeight + "px");
}

// Карта загружается при первом открытии. Адрес …/m/#map=12 (так её открывает программа Аверс) — сразу дом 12 на карте.
let fromMap = false;
async function showMap(houseId) {
  fromMap = true;
  if (!window.openMap) await new Promise((resolve, reject) => document.head.append(Object.assign(document.createElement("script"),
    { src: "map/map.js", onload: resolve, onerror: () => reject(new Error("Не удалось загрузить карту с сервера.")) })));
  await openMap(houseId);
}
const hashHouse = () => (/^#map=(\d+)/.exec(location.hash) || [])[1];

async function api(path) {
  const r = await fetch(path, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Нужно войти заново."); }
  if (r.status === 403) throw new Error("Нет доступа к сведениям о домах.");
  if (!r.ok) throw new Error("Ошибка сервера: " + r.status);
  return r.json();
}

function logout() {
  token = null;
  sessionStorage.removeItem("avers-token");
  window.closeMap?.();
  $("viewer").hidden = true;
  show("login");
}

$("login").onsubmit = async e => {
  e.preventDefault();
  $("login-error").textContent = "";
  const r = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ login: $("user").value, password: $("pass").value })
  });
  if (!r.ok) { $("login-error").textContent = r.status === 429 ? "Слишком много попыток, подождите минуту." : "Неверный логин или пароль."; return; }
  token = (await r.json()).accessToken;
  sessionStorage.setItem("avers-token", token);
  $("pass").value = "";
  if (location.hash.startsWith("#map")) { showMap(+hashHouse() || null); return; }
  show("search");
  $("street").focus();
};

$("logout").onclick = logout;
$("back").onclick = () => fromMap ? showMap() : show("search");
$("map-open").onclick = () => showMap(null).catch(err => alert(err.message));
$("list-open").onclick = () => { fromMap = false; show("search"); };

let timer;
for (const id of ["street", "number"]) $(id).oninput = () => { clearTimeout(timer); timer = setTimeout(search, 300); };

async function search() {
  const street = $("street").value.trim(), number = $("number").value.trim();
  const list = $("houses");
  list.replaceChildren();
  $("search-note").textContent = "";
  if (!street) return;
  try {
    const houses = await api(`/api/mobile/houses?street=${encodeURIComponent(street)}&house=${encodeURIComponent(number)}`);
    if (houses.length === 0) $("search-note").textContent = "Ничего не найдено.";
    for (const h of houses) {
      const b = document.createElement("button");
      b.textContent = h.address;
      b.onclick = () => openHouse(h.id);
      const li = document.createElement("li");
      li.append(b);
      list.append(li);
    }
  } catch (err) { $("search-note").textContent = err.message; }
}

function section(title, rows, cls) {
  const s = document.createElement("section");
  if (cls) s.className = cls;
  const h = document.createElement("h2");
  h.textContent = title;
  const dl = document.createElement("dl");
  for (const [name, value, phone] of rows) {
    if (!value) continue;
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = name;
    if (phone) {
      value.split(/[,;]/).map(p => p.trim()).filter(p => p).forEach((p, i) => {
        const a = document.createElement("a");
        a.href = "tel:" + p.replace(/[^\d+]/g, "");
        a.textContent = p;
        dd.append(...(i ? [", ", a] : [a]));
      });
    } else dd.textContent = value;
    dl.append(dt, dd);
  }
  s.append(h, dl.children.length ? dl : Object.assign(document.createElement("div"), { className: "muted", textContent: "Нет сведений." }));
  return s;
}

async function openHouse(id, fromMapView = false) {
  fromMap = fromMapView;
  const body = $("house-body");
  body.replaceChildren();
  show("house");
  try {
    const h = await api(`/api/mobile/houses/${id}`);
    const title = document.createElement("h1");
    title.style.fontSize = "19px";
    title.textContent = h.address;
    const facts = document.createElement("div");
    facts.className = "muted";
    facts.textContent = `Этажей ${h.floors} · подъездов ${h.entrances} · квартир ${h.apartments}`;
    const onMap = document.createElement("button");
    onMap.className = "scheme";
    onMap.textContent = "Показать на карте";
    onMap.onclick = () => showMap(id).catch(err => alert(err.message));
    body.append(title, facts, onMap);
    if (h.openFault)
      body.append(section("Неустранённая неисправность", [
        ["Что", h.openFault], ["Почему не устранена", h.openFaultReason],
        ["Плановая дата", h.openFaultPlannedFix && new Date(h.openFaultPlannedFix).toLocaleDateString("ru-RU")]
      ], "fault"));
    body.append(section("Обслуживающая организация", [
      ["Название", h.homeowner], ["Филиал", h.homeownerBranch], ["Адрес", h.homeownerAddress],
      ["Телефоны", h.homeownerPhones, true], ["Руководитель", h.headName], ["Телефон руководителя", h.headPhone, true],
      ["Инженер", h.engineerName], ["Телефон инженера", h.engineerPhone, true]
    ]));
    body.append(section("Техника дома", [
      ["Антенны", h.antennas], ["Воздушные кабельные линии", h.aerialCables], ["Усилители", h.amplifiers],
      ["Блоки питания", h.powerSupplies], ["Ключ от техэтажа", h.techFloorKey], ["Прочее", h.otherNotes]
    ]));
    const schemes = section("Схемы СКПТ", h.schemes.filter(s => !s.hasImage).map(s =>
      [s.name, `картинка не загружена, обновлена ${new Date(s.updatedAt).toLocaleDateString("ru-RU")}`]));
    for (const s of h.schemes.filter(s => s.hasImage)) {
      const b = document.createElement("button");
      b.className = "scheme";
      b.textContent = `${s.name} · обновлена ${new Date(s.updatedAt).toLocaleDateString("ru-RU")}`;
      b.onclick = () => openScheme(s.id, b);
      schemes.querySelector("h2").after(b);
    }
    if (h.schemes.some(s => s.hasImage)) schemes.querySelector(".muted")?.remove();
    body.append(schemes);
  } catch (err) {
    body.append(Object.assign(document.createElement("div"), { className: "error", textContent: err.message }));
  }
}

// REQ-MECH-02: схему не скачать — сервер отдаёт картинку с водяным знаком, она рисуется на холсте, прямой ссылки нет.
// Нажатие переключает «по ширине экрана» и «в натуральную величину».
async function openScheme(id, button) {
  const text = button.textContent;
  button.textContent = "Загрузка…";
  try {
    const r = await fetch(`/api/mobile/schemes/${id}`, { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401) { logout(); return; }
    if (!r.ok) throw new Error();
    const image = await createImageBitmap(await r.blob());
    const canvas = $("viewer-canvas"), g = canvas.getContext("2d");
    canvas.width = image.width;
    canvas.height = image.height;
    g.drawImage(image, 0, 0);
    $("viewer").className = "";
    $("viewer").hidden = false;
  } catch { alert("Не удалось открыть схему."); }
  button.textContent = text;
}

$("viewer-canvas").onclick = () => $("viewer").classList.toggle("full");
$("viewer-close").onclick = () => $("viewer").hidden = true;

if (!token) show("login");
else if (location.hash.startsWith("#map")) showMap(+hashHouse() || null).catch(err => alert(err.message));
else show("search");
</script>
</body>
</html>
